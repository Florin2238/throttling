services:
  postgres:
    image: postgres:17
    container_name: throttling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: throttling
      POSTGRES_USER: throttling
      POSTGRES_PASSWORD: throttling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: